name: Ecomera Microservices CI

on:
  workflow_call:
    inputs:
      service-name:
        description: 'Name of the microservice (e.g., auth-service, product-service)'
        required: true
        type: string
      java_version:
        description: 'Java version to use for build'
        required: false
        type: string
        default: '17'
      maven_goals:
        description: 'Maven goals to execute'
        required: false
        type: string
        default: 'clean verify'
    secrets:
      SONAR_TOKEN:
        description: 'SonarCloud token for code quality analysis'
        required: false

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java_version }}
          distribution: 'temurin'
          cache: maven

      - name: Build & test
        run: mvn -B ${{ inputs.maven_goals }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: test-results
          path: target/surefire-reports/*.xml

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: JaCoCo Coverage Report
        if: always()
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 50
          min-coverage-changed-files: 60
          title: Code Coverage Report
          update-comment: true

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: ecomera-${{ inputs.service-name }}-${{ github.sha }}
          path: target/*.jar
          retention-days: 7

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        if: env.SONAR_TOKEN != ''
        run: mvn -B sonar:sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }}